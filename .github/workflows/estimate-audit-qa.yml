name: Estimate Audit QA

on:
  pull_request:
    paths:
      - "estimate-check/**"
      - "scripts/verify_estimate_audit_contract.cjs"
      - "docs/ESTIMATE_AUDIT_*"
      - "proof/estimate-check-2026-08-17/qa-report.json"
      - ".github/workflows/estimate-audit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check estimate-check/app.js
          node --check scripts/verify_estimate_audit_contract.cjs

      - name: Verify estimate-audit contract
        run: node scripts/verify_estimate_audit_contract.cjs

      - name: Reject whitespace errors
        run: |
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1
          git diff --check FETCH_HEAD...HEAD
